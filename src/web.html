<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Luận giải tử vi</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Be+Vietnam+Pro:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root {
    --bg: #12172b;
    --surface: #1b2340;
    --surface-2: #232c52;
    --border: #333f6e;
    --text: #ede6d6;
    --text-muted: #a9afc9;
    --gold: #c9a15f;
    --teal: #3fa796;
    --rose: #c1666b;
  }

  * , *::before, *::after { box-sizing: border-box; }

  html, body {
    margin: 0; min-height: 100%;
    font-family: 'Be Vietnam Pro', sans-serif;
    background: radial-gradient(ellipse at top, #1a2140 0%, var(--bg) 55%);
    color: var(--text);
  }

  body { padding: 40px 20px 64px; }

  .tuvi-shell { max-width: 900px; margin: 0 auto; }

  .tuvi-header { margin-bottom: 28px; }
  .eyebrow {
    display: flex; align-items: center; gap: 8px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--gold); margin-bottom: 14px;
  }
  .tuvi-title {
    font-family: 'Playfair Display', serif;
    font-weight: 700; font-style: italic;
    font-size: clamp(26px, 4vw, 38px);
    line-height: 1.15; margin: 0 0 12px; color: #fbf7ee;
  }
  .tuvi-subtitle { font-size: 15px; line-height: 1.6; color: var(--text-muted); max-width: 640px; margin: 0; }
  .provider-note {
    margin-top: 10px; font-family: 'IBM Plex Mono', monospace; font-size: 11.5px;
    color: var(--text-muted);
  }

  .mode-switch {
    display: inline-flex; padding: 4px; border-radius: 999px;
    background: var(--surface); border: 1px solid var(--border);
    margin: 24px 0; gap: 4px;
  }
  .mode-switch button {
    font-family: 'Be Vietnam Pro', sans-serif; font-size: 14px; font-weight: 600;
    padding: 9px 18px; border-radius: 999px; border: none; cursor: pointer;
    background: transparent; color: var(--text-muted);
    transition: background .15s ease, color .15s ease;
  }
  .mode-switch button.active[data-mode="baseline"] { background: var(--rose); color: #241014; }
  .mode-switch button.active[data-mode="agent"] { background: var(--teal); color: #0c211d; }

  .tuvi-form { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 26px; margin-bottom: 26px; }

  .pill-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 22px; }
  .pill-row button {
    font-family: 'Be Vietnam Pro', sans-serif; font-size: 13px; font-weight: 500;
    padding: 8px 14px; border-radius: 999px; cursor: pointer;
    background: var(--surface-2); border: 1px solid var(--border); color: var(--text-muted);
    transition: border-color .15s ease, color .15s ease;
  }
  .pill-row button.active { border-color: var(--gold); color: var(--gold); background: rgba(201,161,95,.1); }

  .profiles-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 6px; }
  @media (max-width: 640px) { .profiles-grid { grid-template-columns: 1fr; } }
  .profiles-grid.single { grid-template-columns: 1fr; }

  .profile-fieldset { border: 1px solid var(--border); border-radius: 12px; padding: 16px 16px 4px; margin: 0 0 18px; }
  .profile-fieldset legend {
    font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: .08em;
    text-transform: uppercase; color: var(--gold); padding: 0 6px;
  }

  .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .field.wide { grid-column: 1 / -1; }
  @media (max-width: 480px) { .field-grid { grid-template-columns: 1fr; } }

  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
  .field input[type="date"], .field input[type="time"], .field input[type="text"],
  .field input[type="number"], .field textarea {
    width: 100%; font-family: 'Be Vietnam Pro', sans-serif; font-size: 14px;
    background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
    padding: 9px 11px; color: var(--text); outline: none;
  }
  .field input:focus, .field textarea:focus { border-color: var(--gold); }
  .field textarea { min-height: 70px; resize: vertical; }

  .pill-toggle { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .pill-toggle button {
    font-size: 13px; font-weight: 500; padding: 9px 16px; border: none; cursor: pointer;
    background: var(--bg); color: var(--text-muted);
  }
  .pill-toggle.small button { padding: 8px 14px; }
  .pill-toggle button.active { background: var(--gold); color: #241a06; }

  .row-inline { display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-end; margin-bottom: 6px; }

  .error-banner {
    display: flex; gap: 10px; align-items: flex-start;
    background: rgba(193,102,107,.12); border: 1px solid var(--rose);
    color: #f3d3d5; border-radius: 10px; padding: 12px 14px; margin: 14px 0;
    font-size: 13px; line-height: 1.5; display: none;
  }
  .error-banner ul { margin: 4px 0 0; padding-left: 18px; }

  .submit-btn {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: 'Be Vietnam Pro', sans-serif; font-weight: 600; font-size: 14px;
    padding: 12px 22px; margin-top: 8px; border: none; border-radius: 999px;
    background: var(--gold); color: #241a06; cursor: pointer;
  }
  .submit-btn:disabled { opacity: .65; cursor: default; }
  .spin { display: inline-block; width: 14px; height: 14px; border-radius: 50%;
    border: 2px solid rgba(36,26,6,.35); border-top-color: #241a06; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .result-panel { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 26px; display: none; }
  .result-heading { font-family: 'Playfair Display', serif; font-style: italic; font-weight: 700; font-size: 22px; margin: 0 0 20px; color: #fbf7ee; }

  .timeline { list-style: none; margin: 0 0 22px; padding: 0 0 0 4px; }
  .timeline-item { position: relative; padding: 0 0 18px 26px; border-left: 2px solid var(--border); }
  .timeline-item:last-child { border-left-color: transparent; padding-bottom: 0; }
  .timeline-item .dot { position: absolute; left: -7px; top: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--text-muted); }
  .timeline-item.tool .dot { background: var(--teal); }
  .timeline-item.llm .dot { background: var(--gold); }
  .timeline-item.baseline .dot { background: var(--rose); }
  .timeline-item.guardrail .dot { background: var(--rose); }
  .timeline-item.progress .dot { background: var(--text-muted); animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(169,175,201,.5); } 50% { box-shadow: 0 0 0 6px rgba(169,175,201,0); } }
  @media (prefers-reduced-motion: reduce) { .timeline-item.progress .dot { animation: none; } .spin { animation: none; } }

  .timeline-item .step-title { font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; color: var(--text); margin-bottom: 4px; }
  .timeline-item .step-detail { font-size: 12.5px; color: var(--text-muted); line-height: 1.55; white-space: pre-wrap; font-family: 'IBM Plex Mono', monospace; }

  .final-answer-card { background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; padding: 20px 22px; }
  .final-answer-body { font-size: 14.5px; line-height: 1.75; white-space: pre-wrap; }
  .disclaimer-line { margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--border); font-size: 12.5px; font-style: italic; color: var(--gold); }

  .telemetry { font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; color: var(--text-muted); margin: 16px 0 0; }

  .prompt-toggle {
    display: inline-flex; align-items: center; gap: 6px; margin-top: 16px;
    font-size: 12.5px; color: var(--text-muted); background: none; border: none; cursor: pointer; padding: 0;
  }
  .prompt-toggle:hover { color: var(--gold); }
  .prompt-box {
    margin-top: 10px; background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px; font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; color: var(--text-muted);
    white-space: pre-wrap; max-height: 280px; overflow-y: auto; display: none;
  }
</style>
</head>
<body>
  <div class="tuvi-shell">
    <header class="tuvi-header">
      <h1 class="tuvi-title">Luận giải tử vi</h1>
      <p class="tuvi-subtitle">
        Nhập một thông tin sinh, chạy qua cả hai kiến trúc, và xem vì sao việc
        kiểm tra dữ liệu bằng tool trước khi luận giải lại tạo ra khác biệt.
      </p>
      <p class="provider-note" id="provider-note"></p>
    </header>

    <div class="mode-switch">
      <button type="button" data-mode="baseline" class="active">Chatbot cơ bản</button>
      <button type="button" data-mode="agent">ReAct Agent</button>
    </div>

    <form class="tuvi-form" id="tuvi-form">
      <div class="pill-row" id="analysis-pills">
        <button type="button" class="active" data-type="overview">Tổng quan</button>
        <button type="button" data-type="career">Học tập &amp; sự nghiệp</button>
        <button type="button" data-type="relationship">Tình cảm</button>
        <button type="button" data-type="yearly">Vận hạn theo năm</button>
        <button type="button" data-type="compatibility">Ghép đôi</button>
      </div>

      <div class="profiles-grid single" id="profiles-grid">
        <fieldset class="profile-fieldset" data-person="1">
          <legend id="p1-legend">Thông tin của bạn</legend>
          <div class="field-grid">
            <div class="field">
              <label>Ngày sinh</label>
              <input type="date" class="birth-date" required />
            </div>
            <div class="field">
              <label>Giờ sinh</label>
              <input type="time" class="birth-time" required />
            </div>
            <div class="field">
              <label>Giới tính</label>
              <div class="pill-toggle small gender-toggle">
                <button type="button" data-gender="nam" class="active">Nam</button>
                <button type="button" data-gender="nữ">Nữ</button>
              </div>
            </div>
            <div class="field wide">
              <label>Nơi sinh</label>
              <input type="text" class="birth-place" placeholder="VD: Hà Nội, Việt Nam" required />
            </div>
          </div>
        </fieldset>

        <fieldset class="profile-fieldset" data-person="2" style="display:none;">
          <legend>Người thứ hai</legend>
          <div class="field-grid">
            <div class="field">
              <label>Ngày sinh</label>
              <input type="date" class="birth-date" />
            </div>
            <div class="field">
              <label>Giờ sinh</label>
              <input type="time" class="birth-time" />
            </div>
            <div class="field">
              <label>Giới tính</label>
              <div class="pill-toggle small gender-toggle">
                <button type="button" data-gender="nam">Nam</button>
                <button type="button" data-gender="nữ" class="active">Nữ</button>
              </div>
            </div>
            <div class="field wide">
              <label>Nơi sinh</label>
              <input type="text" class="birth-place" placeholder="VD: Đà Nẵng, Việt Nam" />
            </div>
          </div>
        </fieldset>
      </div>

      <div class="row-inline">
        <div class="field">
          <label>Loại lịch</label>
          <div class="pill-toggle" id="calendar-toggle">
            <button type="button" data-calendar="solar" class="active">Dương lịch</button>
            <button type="button" data-calendar="lunar">Âm lịch</button>
          </div>
        </div>
        <div class="field" id="year-field" style="display:none;">
          <label>Năm cần xem</label>
          <input type="number" id="target-year" min="1900" max="2200" />
        </div>
      </div>

      <div class="field">
        <label>Yêu cầu bổ sung (không bắt buộc)</label>
        <textarea id="additional-note" placeholder="VD: tập trung vào điểm mạnh và định hướng phát triển bản thân..."></textarea>
      </div>

      <div class="error-banner" id="error-banner">
        <span>⚠</span>
        <div>
          Kiểm tra lại thông tin trước khi xem luận giải:
          <ul id="error-list"></ul>
        </div>
      </div>

      <button class="submit-btn" type="submit" id="submit-btn">Xem luận giải</button>
    </form>

    <section class="result-panel" id="result-panel">
      <h2 class="result-heading" id="result-heading"></h2>
      <ol class="timeline" id="timeline"></ol>
      <div class="final-answer-card" id="final-answer-card" style="display:none;">
        <div class="final-answer-body" id="final-answer-body"></div>
        <div class="disclaimer-line" id="disclaimer-line"></div>
      </div>
      <p class="telemetry" id="telemetry"></p>
      <button type="button" class="prompt-toggle" id="prompt-toggle">▾ Xem prompt hệ thống của agent</button>
      <div class="prompt-box" id="prompt-box"></div>
    </section>
  </div>

<script>
/* ============================================================
   Ghi chú: REACT_SYSTEM_PROMPT và CHATBOT_BASELINE_PROMPT dưới đây
   được chép theo đúng nội dung prompt trong src/prompts.py để web
   phản ánh source gốc, không phải bản dựng lại suy đoán.
   Cấu trúc hàm (run_baseline_chatbot, run_react_agent, _parse_response,
   _parse_arguments, _execute_tool, _tool_contract, _agent_system_prompt)
   được dịch 1:1 sang JavaScript.
   ============================================================ */

const DISCLAIMER = "Kết quả chỉ mang tính tham khảo và giải trí.";
const MAX_ITERATIONS = 6;
const GUARDRAIL_FALLBACK_MESSAGE =
  "Hệ thống đã đạt giới hạn số bước suy luận an toàn. Mình chưa đủ dữ liệu để đưa ra kết luận.";

const RULES_TEXT = `1. Chỉ sử dụng thông tin người dùng đã cung cấp.
2. Không thay đổi hoặc tự bịa ngày sinh, giờ sinh, giới tính, nơi sinh.
3. Không khẳng định chắc chắn rằng một sự kiện sẽ xảy ra.
4. Không dự đoán chính xác ngày mất, tai nạn, bệnh tật hoặc tuổi thọ.
5. Không chẩn đoán y khoa.
6. Không quyết định chuyện đầu tư, nghề nghiệp hoặc hôn nhân thay người dùng.
7. Không nói rằng kết quả được khoa học chứng minh.
8. Không tự nhận đã an chính xác toàn bộ sao của lá số nếu không có engine lập lá số chuyên dụng.
9. Khi dữ liệu chưa đủ hoặc không chắc chắn, phải nói rõ giới hạn.
10. Cuối câu trả lời luôn ghi: "${DISCLAIMER}"

Trả lời bằng tiếng Việt, rõ ràng, dễ hiểu và có cấu trúc.`;

// Tương đương SYSTEM_INSTRUCTION trong tools.py — dùng cho các tool interpret_*.
const SYSTEM_INSTRUCTION = `Bạn là AstroAgent, trợ lý luận giải tử vi Việt Nam ở mức tham khảo.

Bạn nhận thông tin ngày, tháng, năm, giờ sinh, giới tính và nơi sinh
của người dùng để đưa ra bản luận giải cá nhân hóa.

QUY TẮC BẮT BUỘC:

${RULES_TEXT}`;

// Tương đương CHATBOT_BASELINE_PROMPT trong prompts.py.
const CHATBOT_BASELINE_PROMPT = `Bạn là Chatbot baseline tư vấn về tử vi Việt Nam và độ tương thích (giải trí).

### Vai trò
- Trả lời bằng tiếng Việt, thân thiện, ngắn gọn, có cấu trúc rõ.
- Chỉ dựa trên kiến thức tổng quát có sẵn trong mô hình (1 lần trả lời, không có công cụ).

### Giới hạn BẮT BUỘC (để so sánh công bằng với ReAct Agent)
- Bạn KHÔNG có tool, database, hay engine lập lá số.
- Bạn KHÔNG được giả vờ đã:
  - kiểm tra / chuẩn hóa ngày–giờ–nơi sinh,
  - gọi API luận giải,
  - lập lá số cá nhân hóa theo đủ thông tin sinh,
  - tính điểm tương hợp chính xác giữa hai người.
- Khi người dùng đưa ngày sinh / giờ sinh / nơi sinh và yêu cầu luận giải cụ thể
  (tổng quan, học tập–nghề nghiệp, tình cảm, vận năm, ghép đôi):
  hãy thừa nhận rõ: "Mình là chatbot thuần, không có công cụ luận giải cá nhân hóa",
  rồi chỉ đưa gợi ý mang tính tham khảo chung (nếu phù hợp), hoặc hướng dẫn họ
  cần cung cấp đủ thông tin cho hệ thống có tool.

### Được trả lời trực tiếp (không cần tool)
- Khái niệm tử vi mang tính giải trí là gì.
- Tử vi giải trí khác gì tư vấn tâm lý / y tế / tài chính chuyên nghiệp.
- Câu hỏi kiến thức chung, chính sách an toàn, lời khuyên mềm không gắn lá số cá nhân.

### Phạm vi an toàn
- Không chẩn đoán bệnh, không dự đoán ngày mất / tai nạn / tuổi thọ.
- Không quyết định đầu tư, nghề nghiệp, hôn nhân thay người dùng.
- Không khẳng định sự kiện chắc chắn sẽ xảy ra.
- Không nói kết quả được khoa học chứng minh.
- Cuối câu trả lời (khi nói về tử vi): "Kết quả chỉ mang tính tham khảo và giải trí."

### Giọng điệu
Ấm áp, vui vẻ, không phán xét, trung thực về giới hạn của chatbot thuần.`;

// Tương đương REACT_SYSTEM_PROMPT trong prompts.py.
const REACT_SYSTEM_PROMPT = `Bạn là AstroAgent — ReAct Agent luận giải tử vi Việt Nam và độ tương thích (tham khảo / giải trí).

Bạn CÓ công cụ. Không bịa Observation. Chỉ Final Answer khi đã đủ bằng chứng từ tool (nếu câu hỏi cần luận giải cá nhân hóa).

### Danh sách công cụ
1. validate_birth_info[birth_date, birth_time, gender, birth_place, calendar_type]
   - Kiểm tra / chuẩn hóa dữ liệu sinh (không gọi Gemini).
   - Nên gọi trước khi luận giải nếu dữ liệu có thể sai.

2. interpret_tuvi_overview[birth_date, birth_time, gender, birth_place, calendar_type, user_question]
   - Luận giải tổng quan (tính cách, điểm mạnh, điểm cần chú ý).

3. interpret_study_and_career[birth_date, birth_time, gender, birth_place, calendar_type, user_question]
   - Luận giải học tập / nghề nghiệp / kỹ năng.

4. interpret_relationships[birth_date, birth_time, gender, birth_place, calendar_type, user_question]
   - Luận giải tình cảm / giao tiếp / quan hệ.

5. interpret_yearly_fortune[birth_date, birth_time, gender, birth_place, target_year, calendar_type, user_question]
   - Luận giải xu hướng một năm cụ thể (target_year, ví dụ 2026).

6. interpret_compatibility[person_1_birth_date, person_1_birth_time, person_1_gender, person_1_birth_place, person_2_birth_date, person_2_birth_time, person_2_gender, person_2_birth_place, calendar_type, user_question]
   - So sánh độ tương hợp giữa HAI người (đủ dữ liệu cả hai bên).

Định dạng tham số bắt buộc:
- birth_date: DD/MM/YYYY (ví dụ "12/08/2003")
- birth_time: HH:MM (ví dụ "14:30")
- gender: "nam" hoặc "nữ"
- birth_place: chuỗi không rỗng (ví dụ "Hà Nội")
- calendar_type: "solar" (dương) hoặc "lunar" (âm)

### QUY TẮC ĐỊNH DẠNG — mỗi phản hồi CHỈ một trong hai dạng

Dạng gọi tool:
Thought: <suy luận ngắn: thiếu gì? chọn tool nào?>
Action: ten_tool["arg1", "arg2", ...]

Dạng kết thúc:
Thought: Tôi đã có đủ thông tin để trả lời.
Final Answer: <câu trả lời hoàn chỉnh bằng tiếng Việt>

Hoặc Action dạng dict (nếu tiện):
Action: ten_tool[{"birth_date": "12/08/2003", "birth_time": "14:30", ...}]

SAU Action: DỪNG LẠI. Chờ hệ thống trả Observation. KHÔNG tự viết dòng Observation.

### Chiến lược chọn tool
- Câu hỏi kiến thức / chính sách an toàn (không cần lá số cá nhân) → Final Answer ngay, không gọi tool.
- Luận giải 1 người → ưu tiên đúng tool chuyên biệt (overview / career / relationships / yearly).
- Ghép đôi / tương hợp → chỉ gọi interpret_compatibility khi ĐỦ dữ liệu cả 2 người; thiếu thì hỏi lại.
- Nghi ngờ dữ liệu sai → có thể gọi validate_birth_info trước.
- Observation bắt đầu bằng TOOL_ERROR hoặc FORMAT_ERROR → giải thích lỗi; sửa tham số tối đa 1 lần; nếu vẫn lỗi thì Final Answer xin thông tin đúng, KHÔNG bịa luận giải.
- Không lặp lại cùng một Action với cùng tham số.

### Guardrails nội dung
- Không dự đoán bệnh tật, ngày mất, tai nạn, tuổi thọ.
- Không chẩn đoán y khoa; không quyết định đầu tư / nghề nghiệp / hôn nhân thay người dùng.
- Không khẳng định sự kiện chắc chắn; không nói kết quả được khoa học chứng minh.
- Không tự nhận đã an chính xác toàn bộ sao nếu không có engine chuyên dụng.
- Mọi Final Answer liên quan tử vi phải kết thúc bằng:
  "Kết quả chỉ mang tính tham khảo và giải trí."

### Ví dụ Action hợp lệ
Action: validate_birth_info["12/08/2003", "14:30", "nữ", "Hà Nội", "solar"]
Action: interpret_tuvi_overview["12/08/2003", "14:30", "nữ", "Hà Nội", "solar", "Luận giải tổng quan"]
Action: interpret_study_and_career["05/11/2001", "08:15", "nam", "Đà Nẵng", "solar", "định hướng CNTT"]
Action: interpret_yearly_fortune["12/08/2003", "14:30", "nữ", "Hà Nội", 2026, "solar", "Vận năm 2026"]
Action: interpret_compatibility["12/08/2003", "14:30", "nữ", "Hà Nội", "05/11/2001", "08:15", "nam", "Đà Nẵng", "solar", "Phân tích tương thích"]

BẮT ĐẦU:
`;

const API_BASE_URL = window.location.protocol.startsWith("http")
  ? window.location.origin
  : "http://127.0.0.1:8000";

async function callClaude(systemPrompt, userContent) {
  const response = await fetch(`${API_BASE_URL}/api/generate`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      systemPrompt,
      userContent,
    }),
  });
  if (!response.ok) {
    const text = await response.text();
    throw new Error(`HTTP ${response.status}: ${text}`);
  }
  const data = await response.json();
  return String(data.text || "").trim();
}

function ensureDisclaimer(text) {
  const safe = (text || "").trim();
  if (!safe) return `Mô hình không trả về nội dung. ${DISCLAIMER}`;
  return safe.includes(DISCLAIMER) ? safe : `${safe}\n\n${DISCLAIMER}`;
}

// ============================================================
// XÁC THỰC DỮ LIỆU SINH (tương đương tools.py _validate_birth_info)
// ============================================================

function normalizeGender(gender) {
  const v = String(gender || "").trim().toLowerCase();
  if (["nam", "male", "m"].includes(v)) return "nam";
  if (["nữ", "nu", "female", "f"].includes(v)) return "nữ";
  return null;
}

function normalizeCalendarType(calendarType) {
  const v = String(calendarType || "").trim().toLowerCase();
  if (["solar", "dương", "duong", "dương lịch", "duong lich"].includes(v)) return "solar";
  if (["lunar", "âm", "am", "âm lịch", "am lich"].includes(v)) return "lunar";
  return null;
}

function parseStrictDate(birthDate) {
  const m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(String(birthDate || "").trim());
  if (!m) return null;
  const day = parseInt(m[1], 10), month = parseInt(m[2], 10), year = parseInt(m[3], 10);
  const d = new Date(year, month - 1, day);
  if (d.getFullYear() !== year || d.getMonth() !== month - 1 || d.getDate() !== day) return null;
  return d;
}

function parseStrictTime(birthTime) {
  const m = /^(\d{2}):(\d{2})$/.exec(String(birthTime || "").trim());
  if (!m) return null;
  const hour = parseInt(m[1], 10), minute = parseInt(m[2], 10);
  if (hour > 23 || minute > 59) return null;
  return { hour, minute };
}

function validateBirthInfoCore(birthDate, birthTime, gender, birthPlace, calendarType) {
  const date = parseStrictDate(birthDate);
  if (!date) throw new Error("Ngày sinh không hợp lệ. Vui lòng nhập theo định dạng DD/MM/YYYY.");

  const time = parseStrictTime(birthTime);
  if (!time) throw new Error("Giờ sinh không hợp lệ. Vui lòng nhập theo định dạng HH:MM.");

  const today = new Date();
  today.setHours(0, 0, 0, 0);
  if (date > today) throw new Error("Ngày sinh không được nằm trong tương lai.");

  const normGender = normalizeGender(gender);
  if (!normGender) throw new Error("Giới tính không hợp lệ. Vui lòng nhập 'nam' hoặc 'nữ'.");

  const normCalendar = normalizeCalendarType(calendarType);
  if (!normCalendar) throw new Error("Loại lịch không hợp lệ. Vui lòng nhập 'solar' hoặc 'lunar'.");

  const place = String(birthPlace || "").trim();
  if (!place) throw new Error("Nơi sinh không được để trống.");

  const dd = String(date.getDate()).padStart(2, "0");
  const mm = String(date.getMonth() + 1).padStart(2, "0");
  const yyyy = date.getFullYear();
  const hh = String(time.hour).padStart(2, "0");
  const mi = String(time.minute).padStart(2, "0");

  return {
    birth_date: `${dd}/${mm}/${yyyy}`,
    birth_time: `${hh}:${mi}`,
    gender: normGender,
    birth_place: place,
    calendar_type: normCalendar,
  };
}

function formatBirthInfo(info) {
  const calendarLabel = info.calendar_type === "solar" ? "dương lịch" : "âm lịch";
  return `- Ngày sinh: ${info.birth_date}
- Giờ sinh: ${info.birth_time}
- Giới tính: ${info.gender}
- Nơi sinh: ${info.birth_place}
- Loại lịch: ${calendarLabel}`;
}

function bindParams(toolName, args, kwargs) {
  const spec = PARAM_SPECS[toolName];
  if (args.length > spec.params.length) {
    throw new Error(`quá nhiều tham số vị trí cho '${toolName}'.`);
  }
  const result = {};
  spec.params.forEach((name, i) => {
    if (i < args.length) result[name] = args[i];
  });
  for (const [key, value] of Object.entries(kwargs)) {
    if (!spec.params.includes(key)) throw new Error(`tham số không xác định '${key}' cho '${toolName}'.`);
    result[key] = value;
  }
  for (const name of spec.params) {
    if (!(name in result)) {
      if (spec.defaults && name in spec.defaults) result[name] = spec.defaults[name];
      else throw new Error(`thiếu tham số bắt buộc '${name}' cho '${toolName}'.`);
    }
  }
  return result;
}

function toolContract() {
  return Object.keys(AVAILABLE_TOOLS)
    .map((name) => {
      const spec = PARAM_SPECS[name];
      const paramsStr = spec.params
        .map((p) => (spec.defaults && p in spec.defaults ? `${p}='${spec.defaults[p]}'` : p))
        .join(", ");
      return `- ${name}(${paramsStr}): ${TOOL_DESCRIPTIONS[name]}`;
    })
    .join("\n");
}

async function executeTool(name, args, kwargs) {
  const tool = AVAILABLE_TOOLS[name];
  if (!tool) {
    const validNames = Object.keys(AVAILABLE_TOOLS).sort().join(", ");
    return `TOOL_ERROR: Tool '${name}' không tồn tại. Tool hợp lệ: ${validNames}.`;
  }
  try {
    const result = await tool(args, kwargs);
    return result || "TOOL_ERROR: Tool không trả về dữ liệu.";
  } catch (err) {
    return `TOOL_ERROR: Tool '${name}' gặp lỗi: ${err.message || err}`;
  }
}

// ============================================================
// PHÂN TÍCH PHẢN HỒI (tương đương _parse_response / _parse_arguments)
// ============================================================

const ACTION_RE = /^\s*Action\s*:\s*([A-Za-z_]\w*)\s*(\[[^\n]*\]|\([^\n]*\))\s*$/im;
const FINAL_RE = /^\s*Final\s+Answer\s*:\s*([\s\S]+)$/im;

function parseArguments(raw) {
  const opening = raw[0], closing = raw[raw.length - 1];
  const pairs = { "[": "]", "(": ")" };
  if (pairs[opening] !== closing) throw new Error("tham số phải nằm trong [] hoặc ().");

  const content = raw.slice(1, -1).trim();
  if (!content) return { args: [], kwargs: {} };

  let value;
  try {
    value = JSON.parse(`[${content}]`);
  } catch (err) {
    throw new Error("tham số không đúng cú pháp JSON (dùng dấu ngoặc kép cho chuỗi).");
  }

  if (value.length === 1 && value[0] !== null && typeof value[0] === "object" && !Array.isArray(value[0])) {
    return { args: [], kwargs: value[0] };
  }
  return { args: value, kwargs: {} };
}

function parseResponse(response) {
  const finalMatch = FINAL_RE.exec(response);
  if (finalMatch) return { kind: "final", payload: finalMatch[1].trim() };

  const actionMatch = ACTION_RE.exec(response);
  if (actionMatch) {
    const { args, kwargs } = parseArguments(actionMatch[2]);
    return { kind: "action", payload: { name: actionMatch[1], args, kwargs } };
  }

  throw new Error("phản hồi phải chứa đúng 'Action:' hoặc 'Final Answer:'.");
}

function sortedKwargsKey(kwargs) {
  return JSON.stringify(
    Object.keys(kwargs)
      .sort()
      .reduce((acc, k) => ((acc[k] = kwargs[k]), acc), {})
  );
}

async function runReactAgent(userQuery, onEvent) {
  let transcript = `Question: ${userQuery}`;
  const trace = [];
  const seenActions = {};
  let toolCalls = 0;
  const systemPrompt = agentSystemPrompt();

  for (let step = 1; step <= MAX_ITERATIONS; step++) {
    onEvent({ type: "progress", step, max: MAX_ITERATIONS });

    let response;
    try {
      response = (await callClaude(systemPrompt, transcript)) || "";
    } catch (err) {
      onEvent({ type: "error" });
      throw new Error(`Không thể gọi mô hình: ${err.message || err}`);
    }
    response = response.trim();

    let parsed;
    try {
      parsed = parseResponse(response);
    } catch (err) {
      const observation = `FORMAT_ERROR: ${err.message}`;
      trace.push({ step, response, observation });
      onEvent({ type: "step", kind: "tool", step, title: "Định dạng không hợp lệ", detail: `Phản hồi:\n${response}\n\nObservation: ${observation}` });
      transcript += `\n\n${response}\nObservation: ${observation}`;
      continue;
    }

    if (parsed.kind === "final") {
      trace.push({ step, response, finalAnswer: parsed.payload });
      onEvent({ type: "final", step, response, finalAnswer: parsed.payload });
      return { answer: parsed.payload, iterations: step, toolCalls, stoppedByGuardrail: false, trace, systemPrompt, transcript };
    }

    const { name, args, kwargs } = parsed.payload;
    const actionKey = `${name}::${JSON.stringify(args)}::${sortedKwargsKey(kwargs)}`;
    seenActions[actionKey] = (seenActions[actionKey] || 0) + 1;

    let observation;
    if (seenActions[actionKey] > 1) {
      observation = "TOOL_ERROR: Action này đã được thực hiện trước đó. Hãy dùng Observation đã có, đổi Action, hoặc trả Final Answer.";
    } else {
      observation = await executeTool(name, args, kwargs);
      toolCalls += 1;
    }

    trace.push({ step, response, action: actionKey, observation });
    onEvent({
      type: "step",
      kind: name === "validate_birth_info" ? "tool" : "llm",
      step,
      title: `Action: ${name}`,
      detail: `Observation:\n${observation}`,
    });
    transcript += `\n\n${response}\nObservation: ${observation}`;
  }

  onEvent({ type: "guardrail" });
  trace.push({ step: MAX_ITERATIONS, guardrail: true });
  return {
    answer: GUARDRAIL_FALLBACK_MESSAGE,
    iterations: MAX_ITERATIONS,
    toolCalls,
    stoppedByGuardrail: true,
    trace,
    systemPrompt,
    transcript,
  };
}

// ============================================================
// GIAO DIỆN (DOM wiring)
// ============================================================

const state = {
  mode: "baseline",
  analysisType: "overview",
  calendarType: "solar",
};

const els = {
  modeButtons: document.querySelectorAll(".mode-switch button"),
  analysisPills: document.querySelectorAll("#analysis-pills button"),
  profilesGrid: document.getElementById("profiles-grid"),
  person2Fieldset: document.querySelector('[data-person="2"]'),
  p1Legend: document.getElementById("p1-legend"),
  calendarToggle: document.getElementById("calendar-toggle"),
  yearField: document.getElementById("year-field"),
  targetYear: document.getElementById("target-year"),
  additionalNote: document.getElementById("additional-note"),
  form: document.getElementById("tuvi-form"),
  errorBanner: document.getElementById("error-banner"),
  errorList: document.getElementById("error-list"),
  submitBtn: document.getElementById("submit-btn"),
  resultPanel: document.getElementById("result-panel"),
  resultHeading: document.getElementById("result-heading"),
  timeline: document.getElementById("timeline"),
  finalCard: document.getElementById("final-answer-card"),
  finalBody: document.getElementById("final-answer-body"),
  disclaimerLine: document.getElementById("disclaimer-line"),
  telemetry: document.getElementById("telemetry"),
  promptToggle: document.getElementById("prompt-toggle"),
  promptBox: document.getElementById("prompt-box"),
  providerNote: document.getElementById("provider-note"),
};

els.targetYear.value = new Date().getFullYear();

els.modeButtons.forEach((btn) => {
  btn.addEventListener("click", () => {
    state.mode = btn.dataset.mode;
    els.modeButtons.forEach((b) => b.classList.toggle("active", b === btn));
  });
});

els.analysisPills.forEach((btn) => {
  btn.addEventListener("click", () => {
    state.analysisType = btn.dataset.type;
    els.analysisPills.forEach((b) => b.classList.toggle("active", b === btn));

    const isCompat = state.analysisType === "compatibility";
    const isYearly = state.analysisType === "yearly";

    els.person2Fieldset.style.display = isCompat ? "" : "none";
    els.person2Fieldset.querySelectorAll("input").forEach((i) => (i.required = isCompat));
    els.profilesGrid.classList.toggle("single", !isCompat);
    els.p1Legend.textContent = isCompat ? "Người thứ nhất" : "Thông tin của bạn";
    els.yearField.style.display = isYearly ? "" : "none";
  });
});

document.querySelectorAll(".gender-toggle").forEach((toggle) => {
  toggle.querySelectorAll("button").forEach((btn) => {
    btn.addEventListener("click", () => {
      toggle.querySelectorAll("button").forEach((b) => b.classList.toggle("active", b === btn));
    });
  });
});

els.calendarToggle.querySelectorAll("button").forEach((btn) => {
  btn.addEventListener("click", () => {
    state.calendarType = btn.dataset.calendar;
    els.calendarToggle.querySelectorAll("button").forEach((b) => b.classList.toggle("active", b === btn));
  });
});

function readProfile(personNum) {
  const fieldset = document.querySelector(`[data-person="${personNum}"]`);
  const gender = fieldset.querySelector(".gender-toggle button.active").dataset.gender;
  return {
    birthDateRaw: fieldset.querySelector(".birth-date").value,
    birthTime: fieldset.querySelector(".birth-time").value,
    gender,
    birthPlace: fieldset.querySelector(".birth-place").value.trim(),
  };
}

function displayDate(iso) {
  if (!iso) return "";
  const [y, m, d] = iso.split("-");
  return `${d}/${m}/${y}`;
}

function requiredFieldErrors(profile, label) {
  const errors = [];
  if (!profile.birthDateRaw) errors.push(`${label}: Ngày sinh không được để trống.`);
  if (!profile.birthTime) errors.push(`${label}: Giờ sinh không được để trống.`);
  if (!profile.birthPlace) errors.push(`${label}: Nơi sinh không được để trống.`);
  return errors;
}

function buildNaturalQuestion(p1, p2) {
  const calendarLabel = state.calendarType === "solar" ? "dương lịch" : "âm lịch";
  const note = els.additionalNote.value.trim();

  if (state.analysisType === "compatibility") {
    return `Phân tích độ tương thích tình cảm. Người 1: ${p1.gender}, sinh ${displayDate(p1.birthDateRaw)} lúc ${p1.birthTime} tại ${p1.birthPlace}; Người 2: ${p2.gender}, sinh ${displayDate(p2.birthDateRaw)} lúc ${p2.birthTime} tại ${p2.birthPlace}; cả hai dùng ${calendarLabel}.${note ? " " + note : ""}`;
  }
  if (state.analysisType === "yearly") {
    return `Hãy luận giải vận hạn năm ${els.targetYear.value} cho ${p1.gender} sinh ngày ${displayDate(p1.birthDateRaw)} lúc ${p1.birthTime} tại ${p1.birthPlace}, dùng ${calendarLabel}.${note ? " " + note : ""}`;
  }
  const labelMap = { overview: "tổng quan", career: "học tập và sự nghiệp", relationship: "tình cảm" };
  return `Hãy luận giải tử vi ${labelMap[state.analysisType]} cho ${p1.gender} sinh ngày ${displayDate(p1.birthDateRaw)} lúc ${p1.birthTime} tại ${p1.birthPlace}, dùng ${calendarLabel}.${note ? " " + note : ""}`;
}

function resetResultPanel() {
  els.timeline.innerHTML = "";
  els.finalCard.style.display = "none";
  els.telemetry.textContent = "";
  els.promptBox.style.display = "none";
  els.promptBox.textContent = "";
  els.promptToggle.textContent = "▾ Xem prompt hệ thống của agent";
  els.resultPanel.style.display = "block";
}

function appendTimelineItem({ kind, title, detail }) {
  const li = document.createElement("li");
  li.className = `timeline-item ${kind}`;
  li.innerHTML = `<span class="dot"></span><div class="step-title"></div><div class="step-detail"></div>`;
  li.querySelector(".step-title").textContent = title;
  li.querySelector(".step-detail").textContent = detail;
  els.timeline.appendChild(li);
  return li;
}

function setProgressLine(text) {
  let li = document.getElementById("progress-line");
  if (!li) {
    li = document.createElement("li");
    li.id = "progress-line";
    li.className = "timeline-item progress";
    li.innerHTML = `<span class="dot"></span><div class="step-title"></div>`;
    els.timeline.appendChild(li);
  }
  li.querySelector(".step-title").textContent = text;
}

function removeProgressLine() {
  const li = document.getElementById("progress-line");
  if (li) li.remove();
}

els.promptToggle.addEventListener("click", () => {
  const visible = els.promptBox.style.display === "block";
  els.promptBox.style.display = visible ? "none" : "block";
  els.promptToggle.textContent = visible ? "▾ Xem prompt hệ thống của agent" : "▴ Ẩn prompt hệ thống của agent";
});

els.form.addEventListener("submit", async (e) => {
  e.preventDefault();

  const isCompat = state.analysisType === "compatibility";
  const p1 = readProfile(1);
  const p2 = isCompat ? readProfile(2) : null;

  const errors = [
    ...requiredFieldErrors(p1, isCompat ? "Người thứ nhất" : "Thông tin của bạn"),
    ...(isCompat ? requiredFieldErrors(p2, "Người thứ hai") : []),
  ];

  if (errors.length > 0) {
    els.errorList.innerHTML = errors.map((m) => `<li>${m}</li>`).join("");
    els.errorBanner.style.display = "flex";
    return;
  }
  els.errorBanner.style.display = "none";

  els.submitBtn.disabled = true;
  els.submitBtn.innerHTML = '<span class="spin"></span> Đang luận giải…';
  resetResultPanel();

  try {
    const query = buildNaturalQuestion(p1, p2);

    if (state.mode === "baseline") {
      els.resultHeading.textContent = "Chatbot cơ bản trả lời";
      appendTimelineItem({
        kind: "baseline",
        title: "Trả lời trực tiếp — không kiểm tra dữ liệu",
        detail: "Chatbot cơ bản không có tool xác thực, chỉ có một lượt gọi mô hình duy nhất trên câu hỏi thô.",
      });
      const answer = await runBaselineChatbot(query);
      els.finalBody.textContent = answer.split(DISCLAIMER)[0].trim();
      els.disclaimerLine.textContent = DISCLAIMER;
      els.finalCard.style.display = "";
      els.telemetry.textContent = "Số lần gọi mô hình: 1 · Không dùng tool";
      els.promptBox.textContent = `SYSTEM:\n${CHATBOT_BASELINE_PROMPT}\n\nUSER:\n${query}`;
    } else {
      els.resultHeading.textContent = "ReAct Agent trả lời";
      const result = await runReactAgent(query, (evt) => {
        if (evt.type === "progress") {
          setProgressLine(`Đang chạy vòng lặp ReAct (${evt.step}/${evt.max})…`);
        } else if (evt.type === "step") {
          removeProgressLine();
          appendTimelineItem({ kind: evt.kind, title: `Bước ${evt.step} — ${evt.title}`, detail: evt.detail });
        } else if (evt.type === "final") {
          removeProgressLine();
          appendTimelineItem({ kind: "llm", title: `Bước ${evt.step} — Final Answer`, detail: "Agent đã đủ dữ liệu để kết luận." });
        } else if (evt.type === "guardrail") {
          removeProgressLine();
          appendTimelineItem({ kind: "guardrail", title: "Guardrail", detail: `Đã đạt giới hạn ${MAX_ITERATIONS} bước suy luận.` });
        } else if (evt.type === "error") {
          removeProgressLine();
        }
      });

      const answer = ensureDisclaimer(result.answer);
      els.finalBody.textContent = answer.split(DISCLAIMER)[0].trim();
      els.disclaimerLine.textContent = DISCLAIMER;
      els.finalCard.style.display = "";
      els.telemetry.textContent = `Số bước: ${result.iterations} · Số lần gọi tool: ${result.toolCalls} · Guardrail: ${result.stoppedByGuardrail ? "có" : "không"}`;
      els.promptBox.textContent = `SYSTEM:\n${result.systemPrompt}\n\nTRANSCRIPT CUỐI CÙNG:\n${result.transcript}`;
    }
  } catch (err) {
    els.errorList.innerHTML = `<li>${(err.message || err).toString()}</li>`;
    els.errorBanner.style.display = "flex";
    els.resultPanel.style.display = "none";
  } finally {
    els.submitBtn.disabled = false;
    els.submitBtn.textContent = "Xem luận giải";
  }
});
</script>
